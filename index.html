<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI QUEST ～生成AIの世界を冒険しよう～ v1.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">🤖 AI QUEST</div>
    <div class="status">
      <span id="level">Lv.1</span><span id="exp">EXP 0</span><span id="coins">🪙 0</span>
    </div>
  </header>

  <main>
    <section id="home" class="screen active">
      <div class="hero">
        <div class="hero-icon">🐱</div>
        <p class="eyebrow">GENERATIVE AI ADVENTURE</p>
        <h1>AI QUEST</h1>
        <p>遊びながら、生成AIを「使える力」に変えていこう。</p>
        <div class="buttons">
          <button id="continueBtn" class="primary">続きから</button>
          <button id="startBtn">最初から</button>
        </div>
        <p id="saveHint" class="muted"></p>
      </div>
    </section>

    <section id="map" class="screen">
      <div class="section-head"><div><p class="eyebrow">WORLD MAP</p><h2>AI世界マップ</h2></div><button data-screen="home" class="ghost">タイトルへ</button></div>
      <div id="mapGrid" class="map-grid"></div>
    </section>

    <section id="quests" class="screen">
      <div class="section-head"><div><p class="eyebrow">QUEST BOARD</p><h2 id="areaTitle">クエスト</h2></div><button data-screen="map" class="ghost">マップへ</button></div>
      <div id="questList"></div>
    </section>

    <section id="quest" class="screen">
      <div class="quest-shell">
        <div class="quest-meta"><span id="questTag"></span><span id="questReward"></span></div>
        <h2 id="questTitle"></h2>
        <p id="questIntro"></p>
        <div id="questBody"></div>
        <div id="feedback" class="feedback hidden"></div>
        <div class="quest-actions">
          <button id="backQuest" class="ghost">クエスト一覧</button>
          <button id="checkBtn" class="primary">回答を確認</button>
        </div>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="result-card">
        <div id="resultIcon" class="result-icon">🎉</div>
        <p class="eyebrow">QUEST RESULT</p>
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
        <div id="resultStats" class="stats"></div>
        <button id="resultNext" class="primary">次へ</button>
      </div>
    </section>

    <section id="profile" class="screen">
      <div class="section-head"><div><p class="eyebrow">PROFILE</p><h2>冒険者プロフィール</h2></div><button data-screen="map" class="ghost">戻る</button></div>
      <div class="profile-card">
        <div class="avatar">🐱</div><div><h3 id="profileName">AI QUEST冒険者</h3><p id="profileLevel"></p></div>
      </div>
      <div id="skills" class="skills"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-screen="map">🗺️<span>マップ</span></button>
    <button data-screen="profile">📖<span>プロフィール</span></button>
    <button id="saveBtn">💾<span>保存</span></button>
  </nav>
</div>
<script src="script.js"></script>
</body>
</html>
